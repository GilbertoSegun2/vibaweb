{% load static %}
<!-- ⭐ HERO DINÁMICO (Se adapta a MG o Expresos Mérida) -->
<style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap');

    /* Estilos base del Hero */
    .hero-dinamico {
        color: white;
        padding: 60px 20px;
        text-align: center;
        position: relative;
        overflow: hidden;
        border-radius: 0 0 20px 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Estilo 1: Expresos Mérida (Fondo Azul) */
    .hero-merida-bg {
        background: linear-gradient(135deg, #0F75BB, #26AAE1);
    }

    /* Estilo 2: MG (Fondo Grafito/Negro) */
    .hero-mg-bg {
        background: linear-gradient(135deg, #2b2b2b 0%, #000000 100%);
        border-bottom: 4px solid #FFD700; /* Línea amarilla inferior */
    }

    /* Diseño de textos para MG */
    .hero-logo-texto {
        font-family: 'Anton', sans-serif;
        font-size: 8rem; /* ⭐ Más grande (antes 6rem) */
        line-height: 0.85;
        color: #FFD700;
        text-shadow: 4px 4px 0px #333, 8px 8px 20px rgba(0,0,0,0.8); /* Sombra más imponente */
        margin: 0;
        letter-spacing: 2px;
        display: inline-block;
    }
    .hero-logo-texto span {
        color: #FFFFFF;
        font-size: 3.5rem; /* ⭐ Más grande (antes 2.5rem) */
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        vertical-align: bottom;
        margin-left: 5px;
    }
    .hero-subtitulo-mg {
        font-family: 'Oswald', sans-serif;
        font-size: 1.8rem; /* ⭐ Más grande (antes 1.4rem) */
        letter-spacing: 5px; /* Un poco más de espacio entre letras */
        text-transform: uppercase;
        margin-top: 15px;
        font-weight: 500;
        color: #FFFFFF;
        border-top: 2px solid #FFD700;
        border-bottom: 2px solid #FFD700;
        display: inline-block;
        padding: 6px 25px;
    }

    /* Estilos para los títulos dinámicos */
    .hero-bienvenida {
        font-family: 'Oswald', sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
        text-transform: none;
        margin-top: 25px;
        letter-spacing: 0.5px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .hero-descripcion {
        font-size: 1rem;
        max-width: 600px;
        margin: 10px auto 0 auto;
        opacity: 0.9;
        font-weight: 300;
    }
</style>

<!-- LÓGICA DE DETECCIÓN: Si el icono es "MG", usamos el fondo oscuro -->
{% if navbar_icono == 'MG' or navbar_icono == 'mg' %}
    
    <div class="hero-dinamico hero-mg-bg">
        <div class="container position-relative z-1">
            <!-- Logo tipográfico de MG (Aumentado) -->
            <div class="mb-2">
                <span class="hero-logo-texto">MG<span>c.a.</span></span>
            </div>
            <div class="hero-subtitulo-mg mb-4">Transporte Marino Guerrero</div>
            
            <!-- Textos dinámicos desde el admin -->
            <h1 class="hero-bienvenida">{{ bienvenida_titulo }}</h1>
            <p class="hero-descripcion">{{ bienvenida_subtitulo }}</p>
        </div>
    </div>

{% else %}

    <!-- DISEÑO ORIGINAL PARA EXPRESOS MÉRIDA -->
    <div class="hero-dinamico hero-merida-bg">
        <div class="container position-relative z-1">
            <img src="{% static 'img/iconos/logo_merida.png' %}" alt="Logo" height="90" class="mb-3 bg-white rounded-pill p-2 shadow-sm">
            <h1 class="hero-bienvenida">{{ bienvenida_titulo }}</h1>
            <p class="hero-descripcion">{{ bienvenida_subtitulo }}</p>
        </div>
    </div>

{% endif %}
