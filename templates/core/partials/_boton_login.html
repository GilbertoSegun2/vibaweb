<!-- ⭐ BOTÓN PREMIUM DE INICIAR SESIÓN (VERDE BANESCO) -->
{% if not user.is_authenticated %}
<div class="container text-center my-4">
    <a href="{% url 'core:login' %}" class="btn btn-lg" style="
        background-color: #ffffff;
        color: #008f39; /* Verde Banesco */
        border: 2px solid #008f39;
        border-radius: 50px;
        padding: 12px 30px;
        font-weight: 700;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
        max-width: 400px;
        margin: 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        text-decoration: none;
        transition: all 0.3s ease;
    " onmouseover="this.style.backgroundColor='#008f39'; this.style.color='#ffffff'; this.style.transform='translateY(-2px)';" onmouseout="this.style.backgroundColor='#ffffff'; this.style.color='#008f39'; this.style.transform='translateY(0)';">
        <i class="bi bi-person-fill"></i> Iniciar Sesión
    </a>
    
    <!-- ⭐ ENLACE DE REGISTRO CON EFECTO HOVER -->
    <p class="text-muted small mt-3">
        Para comprar boletos, debe iniciar sesión o 
        <a href="{% url 'core:registro' %}" class="text-decoration-none fw-bold" 
           style="color: #0F75BB; transition: all 0.3s ease;"
           onmouseover="this.style.color='#008f39'; this.style.textDecoration='underline';"
           onmouseout="this.style.color='#0F75BB'; this.style.textDecoration='none';">
           registrarse
        </a>.
    </p>
</div>
{% endif %}
