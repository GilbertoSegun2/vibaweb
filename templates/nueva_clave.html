{% extends 'base.html' %}

{% block title %}Nueva Contraseña - Viba-Web{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center" style="color: #003366;">
                    <i class="bi bi-key-fill"></i> Nueva Contraseña
                </h3>

                <p class="text-muted text-center mb-4">
                    Identidad verificada. Cree su nueva contraseña.
                </p>

                <form method="post" onsubmit="mostrarCarga('Guardando...', 'Por favor, espere.');">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Nueva contraseña</label>
                        <div class="input-group">
                            <input type="password" name="clave1" class="form-control" required minlength="8">
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword(this)" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="form-text">Mínimo 8 caracteres.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Repetir contraseña</label>
                        <div class="input-group">
                            <input type="password" name="clave2" class="form-control" required minlength="8">
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword(this)" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary px-5 w-100" style="background-color: #003366; border-color: #003366;">
                            <i class="bi bi-check-circle"></i> Guardar Contraseña
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'core:login' %}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Volver al Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
