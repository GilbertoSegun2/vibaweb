{% load static %}
<!-- ⭐ HERO EXCLUSIVO DE MARINO GUERRERO (Diseño Oscuro con Logo Tipográfico) -->
<style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap');

    /* Estilos para el fondo oscuro de MG */
    .hero-mg-bg {
        background: linear-gradient(135deg, #2b2b2b 0%, #000000 100%);
        border-bottom: 4px solid #FFD700; /* Línea amarilla inferior */
        color: white;
        padding: 60px 20px;
        text-align: center;
        position: relative;
        overflow: hidden;
        border-radius: 0 0 20px 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Diseño de textos para MG */
    .hero-logo-texto {
        font-family: 'Anton', sans-serif;
        font-size: 8rem; /* Tamaño gigante */
        line-height: 0.85;
        color: #FFD700;
        text-shadow: 4px 4px 0px #333, 8px 8px 20px rgba(0,0,0,0.8);
        margin: 0;
        letter-spacing: 2px;
        display: inline-block;
    }
    .hero-logo-texto span {
        color: #FFFFFF;
        font-size: 3.5rem; /* Tamaño de "c.a." */
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        vertical-align: bottom;
        margin-left: 5px;
    }
    .hero-subtitulo-mg {
        font-family: 'Oswald', sans-serif;
        font-size: 1.8rem;
        letter-spacing: 5px;
        text-transform: uppercase;
        margin-top: 15px;
        font-weight: 500;
        color: #FFFFFF;
        border-top: 2px solid #FFD700;
        border-bottom: 2px solid #FFD700;
        display: inline-block;
        padding: 6px 25px;
    }

    /* Título dinámico inferior */
    .hero-bienvenida {
        font-family: 'Oswald', sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
        text-transform: none;
        margin-top: 25px;
        letter-spacing: 0.5px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .hero-descripcion {
        font-size: 1rem;
        max-width: 600px;
        margin: 10px auto 0 auto;
        opacity: 0.9;
        font-weight: 300;
    }
</style>

<div class="hero-mg-bg">
    <div class="container position-relative z-1">
        
        <!-- El Logo "MGc.a." Gigante -->
        <div class="mb-2">
            <span class="hero-logo-texto">MG<span>c.a.</span></span>
        </div>
        
        <!-- El subtítulo con las líneas amarillas -->
        <div class="hero-subtitulo-mg mb-4">Transporte Marino Guerrero</div>
        
        <!-- El título dinámico que viene del Parámetro 160 -->
        <h1 class="hero-bienvenida">{{ bienvenida_titulo }}</h1>
        <p class="hero-descripcion">{{ bienvenida_subtitulo }}</p>
        
    </div>
</div>
