{% extends 'base.html' %}
{% load static %}
{% block title %}Inicio - Viba-Web{% endblock %}

{% block content %}
    {% include 'partials/_hero.html' %}
    
    <div class="container mt-4">
        <!-- Buscador con combos (el actual) -->
        <div class="card shadow-sm mb-4" style="max-width: 800px; margin: -40px auto 0 auto; position: relative; z-index: 10; border-radius: 15px;">
            <div class="card-body p-4">
                <form method="get" action="{% url 'core:buscar_viajes' %}" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Origen</label>
                        <select name="origen" class="form-select" required>
                            {% for oficina in oficinas %}
                                <option value="{{ oficina.id }}" {% if origen_seleccionado == oficina.id %}selected{% endif %}>
                                    {{ oficina.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Destino</label>
                        <select name="destino" class="form-select" required>
                            <option value="">Seleccione destino...</option>
                            {% for oficina in oficinas %}
                                <option value="{{ oficina.id }}" {% if destino_seleccionado == oficina.id %}selected{% endif %}>
                                    {{ oficina.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Fecha</label>
                        <input type="date" name="fecha" class="form-control" value="{{ hoy|default:'' }}" min="{{ hoy|default:'' }}" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100 fw-bold" style="height: 38px; background-color: #0F75BB; border-color: #0F75BB;">
                            <i class="bi bi-search"></i> Buscar
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        {% include 'partials/_pilares.html' %}
    </div>
{% endblock %}
